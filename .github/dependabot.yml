version: 2
updates:
  # The package has no JS or PHP dependencies of its own to update; this keeps
  # the GitHub Actions used by CI and auto-merge current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
